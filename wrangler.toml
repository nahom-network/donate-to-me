
name = "donate-to-me"
main = "src/index.ts"
compatibility_date = "2026-10-06"

# Automatically provisioned for each user
[[kv_namespaces]]
binding = "SESSIONS"

[[d1_databases]]
binding = "DB"
database_name = "donate-to-me"

# The built React dashboard lands in public/dashboard at deploy time.
# sticker.webp also lives here so the bot's /start photo keeps working.
[assets]
directory = "./public"
# Exposes env.ASSETS so /admin can serve the SPA shell itself.
binding = "ASSETS"

# Users can customize these during deployment
[vars]
JAMI_PRODUCT_ID = ""
DONATION_AMOUNTS = "1,5,10,50,100,250,500"
WEBHOOK_URL = ""
# Optional: public image URL for /start. Empty uses the bundled sticker.
START_IMAGE_URL = ""
# Admin dashboard (https://<host>/admin). Get the client id/secret from
# BotFather → your bot → Login Widget. The allowlist is Telegram user ids.
TELEGRAM_OIDC_CLIENT_ID = "8507119974"
ADMIN_TELEGRAM_IDS = "1028671687"
# Optional: pin the public origin used for the OIDC redirect URI, e.g.
# ADMIN_BASE_URL = "https://donate-to-me.example.workers.dev"

[triggers]
crons = ["*/15 * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
