
name = "donate-to-me"
main = "src/index.ts"
compatibility_date = "2026-10-06"

# Automatically provisioned for each user
[[kv_namespaces]]
binding = "SESSIONS"

[[d1_databases]]
binding = "DB"
database_name = "donate-to-me"

[assets]
directory = "./src/assets"

# Users can customize these during deployment
[vars]
JAMI_PRODUCT_ID = ""
DONATION_AMOUNTS = "1,5,10,50,100,250,500"
WEBHOOK_URL = ""
# Optional: public image URL for /start. Empty uses the bundled sticker.
START_IMAGE_URL = ""

[triggers]
crons = ["*/15 * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
